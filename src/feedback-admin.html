<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>开拍 · 私人反馈列表</title><link rel="stylesheet" href="/feedback-admin/admin.css"><script type="module" src="/feedback-admin/admin.js"></script></head>
<body><main><header><div><p class="eyebrow">RALLY / PRIVATE INBOX</p><h1>玩家反馈</h1><p class="muted">查看建议，记录处理进度。</p></div><button id="logout" hidden>退出登录</button></header>
<form id="login-form"><label for="token">管理密码</label><div class="login-row"><input id="token" type="password" required autocomplete="off" spellcheck="false" placeholder="输入管理密码"><button class="primary" type="submit">登录</button></div><small>刷新或退出后需要重新登录。</small></form>
<p id="notice" role="status" aria-live="polite"></p>
<section id="inbox" hidden><div class="filters"><label>处理状态<select id="status-filter"><option value="">全部状态</option><option value="pending">待处理</option><option value="processing">处理中</option><option value="resolved">已处理</option></select></label><label>问题类型<select id="category-filter"><option value="">全部类型</option><option value="controls">操作手感</option><option value="network">联机</option><option value="performance">画面性能</option><option value="suggestion">功能建议</option><option value="other">其他</option></select></label><button id="refresh">刷新列表</button><span id="count"></span></div><div class="workspace"><div id="items" aria-label="反馈列表"></div><article id="detail" tabindex="-1"><p class="muted">选择一条反馈查看内容。</p></article></div></section>
</main></body></html>
